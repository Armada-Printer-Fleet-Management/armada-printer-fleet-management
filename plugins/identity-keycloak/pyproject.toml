[project]
name = "identity-keycloak"
version = "0.1.0"
description = "IdentityDirectory plugin that creates and deletes accounts through Keycloak's Admin REST API"
requires-python = "==3.13.*"

dependencies = [
  "plugin-api",
  "httpx2>=2.16,<3", # https://github.com/pydantic/httpx2, BSD-3-Clause -- async HTTP client for the Admin REST API
]

[tool.uv.sources]
plugin-api = { path = "../../packages/plugin-api", editable = true }

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest>=9,<10",  # https://github.com/pytest-dev/pytest, MIT
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_keycloak"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
