name: armada-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: armada
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: armada
    ports:
      - 127.0.0.1::5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U armada']
      interval: 5s
      timeout: 3s
      retries: 10

  garage-s3-storage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:?}
    ports:
      - 127.0.0.1::3900
    volumes:
      - ../deploy/garage.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage/meta
      - /var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    ports:
      - 127.0.0.1::8080
    volumes:
      - ../deploy/armada-realm.json:/opt/keycloak/data/import/armada-realm.json:ro
    healthcheck:
      start_period: 60s
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      timeout: 5s
      retries: 10