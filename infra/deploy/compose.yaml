# The full application stack, used by every deployed machine alike: testing, staging and every
# user installation. They differ only in their environment file. Images are pulled, never built
# here. Never run `docker compose down -v`: it deletes the database, the stored files and Caddy's
# certificates.
name: armada

services:
  web:
    image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/armada-web${IMAGE_SUFFIX:-}:${VERSION:?}
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  server:
    image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/armada-server${IMAGE_SUFFIX:-}:${VERSION:?}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      garage-s3-storage:
        condition: service_healthy
    environment:
      FILE_STORE_BACKEND: ${FILE_STORE_BACKEND:-s3}
      FILE_STORE_ENDPOINT_URL: http://garage-s3-storage:3900
      FILE_STORE_REGION: garage
      FILE_STORE_BUCKET: ${GARAGE_DEFAULT_BUCKET:?}
      FILE_STORE_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      FILE_STORE_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
      DB_HOST: db
      DB_NAME: armada
      DB_USER: armada
      DB_PASSWORD: ${DB_PASSWORD:?}

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: armada
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: armada
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armada"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage-s3-storage:
    image: dxflrs/garage:v2.4.1
    restart: always
    # Creates the single-node layout, access key and bucket on first start; later starts find
    # them already there.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:?}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # Time to close its metadata database cleanly instead of being killed mid-write.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: always
    command: ['start', '--import-realm']
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HTTP_ENABLED: 'true' # TLS ends at Caddy
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded # allow Keycloak to trust the X-Forwarded-* headers from Caddy
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    # Caddy serves only the armada realm, so operators reach the admin console through an SSH
    # tunnel to this port.
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./armada-realm.json:/opt/keycloak/data/import/armada-realm.json:ro
    healthcheck:
      start_period: 60s
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  garage_meta:
  garage_data:
  keycloak_pgdata:
  caddy_data:
  caddy_config:
