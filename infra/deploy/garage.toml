# Garage, the S3-compatible store for model and sliced files. Mounted read-only into the garage
# container by both compose files. rpc_secret is not set here: Garage reads it from
# GARAGE_RPC_SECRET, which the environment file supplies.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

# sqlite rather than lmdb: it survives an unclean shutdown far better, and an on-premise machine
# will lose power at some point. lmdb's speed only pays off with replication.
db_engine = "sqlite"

# One machine, no replication. Redundancy, if wanted, belongs to the disks underneath.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
