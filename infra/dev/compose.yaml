# The local development stack: server and web with live reload, plus the backing services. Start
# it with `python scripts/compose_run.py dev`, which supplies the environment file. Every port is
# bound to localhost so nothing is reachable from the network; db, keycloak and garage-s3-storage are
# published so a natively run server can use them too. Never run `docker compose down -v` unless
# you mean to wipe the local database and stored files.
name: armada-dev

services:
  # Brings the database up to the latest migration and seeds the development data, then exits.
  # The server waits for it. After adding a migration, apply it with
  # `docker compose -p armada-dev run --rm migrate`.
  migrate:
    build:
      context: ../..
      dockerfile: apps/server/dev.Dockerfile
    image: armada-server-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: armada
      DB_USER: armada
      DB_PASSWORD: ${DB_PASSWORD:?}
    command: ['sh', '-c', 'uv run alembic upgrade head && uv run python dev_seed.py']
    # The image's check probes the server's port, which this one-shot container never opens.
    healthcheck:
      disable: true

  server:
    build:
      context: ../..
      dockerfile: apps/server/dev.Dockerfile
    image: armada-server-dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      garage-s3-storage:
        condition: service_healthy
    environment:
      LOG_FORMAT: console
      FILE_STORE_BACKEND: ${FILE_STORE_BACKEND:-s3}
      FILE_STORE_ENDPOINT_URL: http://garage-s3-storage:3900
      FILE_STORE_REGION: garage
      FILE_STORE_BUCKET: ${GARAGE_DEFAULT_BUCKET:?}
      FILE_STORE_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      FILE_STORE_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
    ports:
      - 127.0.0.1:8000:8000
    develop:
      watch:
        # Includes api/gen, so rerunning OpenAPI codegen on the host reaches the container too.
        - action: sync
          path: ../../apps/server/api
          target: /repo/apps/server/api
        - action: rebuild
          path: ../../apps/server/pyproject.toml
        - action: rebuild
          path: ../../apps/server/uv.lock
        # Includes the shared generated Python code, so rerunning codegen rebuilds the container.
        - action: rebuild
          path: ../../packages/proto/utils
        - action: rebuild
          path: ../../packages/organization-info
        - action: rebuild
          path: ../../packages/core-domain
        - action: rebuild
          path: ../../packages/plugin-api
        - action: rebuild
          path: ../../plugins/s3-file-store

  web:
    build:
      context: ../..
      dockerfile: apps/web/dev.Dockerfile
    image: armada-web-dev
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://server:8000
      KEYCLOAK_PROXY_TARGET: http://keycloak:8080
    ports:
      - 127.0.0.1:5174:5174
    develop:
      watch:
        # Generated API client code is synced from the host after codegen.
        - action: sync
          path: ../../apps/web/src
          target: /repo/apps/web/src
        - action: sync
          path: ../../apps/web/index.html
          target: /repo/apps/web/index.html
        # pnpm links workspace packages to their source, so syncing the source reaches the app.
        # Their package.json is left to the rebuild rules below.
        - action: sync
          path: ../../packages/ui-kit
          target: /repo/packages/ui-kit
          ignore:
            - package.json
        - action: sync
          path: ../../packages/api-client
          target: /repo/packages/api-client
          ignore:
            - package.json
        # Read once when the dev server starts, so a change needs a restart.
        - action: sync+restart
          path: ../../apps/web/vite.config.ts
          target: /repo/apps/web/vite.config.ts
        - action: sync+restart
          path: ../../apps/web/tsconfig.json
          target: /repo/apps/web/tsconfig.json
        - action: sync+restart
          path: ../../tsconfig.base.json
          target: /repo/tsconfig.base.json
        - action: sync+restart
          path: ../../packages/organization-info
          target: /repo/packages/organization-info
          ignore:
            - package.json
        # These decide what pnpm installs into the image.
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../pnpm-workspace.yaml
        - action: rebuild
          path: ../../apps/web/package.json
        - action: rebuild
          path: ../../packages/ui-kit/package.json
        - action: rebuild
          path: ../../packages/organization-info/package.json
        - action: rebuild
          path: ../../packages/api-client/package.json

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: armada
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: armada
    ports:
      # If DB_PORT isn't set in config/compose.dev.env, the default is 5432. If port 5432 is
      # already in use on the host, uncomment or add DB_PORT there with a free port.
      - 127.0.0.1:${DB_PORT:-5432}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U armada']
      interval: 5s
      timeout: 3s
      retries: 10

  garage-s3-storage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:?}
    ports:
      - 127.0.0.1:3900:3900
    volumes:
      - ../deploy/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded # allow Keycloak to trust the X-Forwarded-* headers from Vite/Caddy
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ../deploy/armada-realm.json:/opt/keycloak/data/import/armada-realm.json:ro
    healthcheck:
      start_period: 60s
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  garage_meta:
  garage_data:
  keycloak_pgdata:
