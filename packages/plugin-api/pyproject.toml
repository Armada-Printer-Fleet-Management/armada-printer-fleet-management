[project]
name = "plugin-api"
version = "0.1.0"
description = "Defines generalized protocols for plugins.  Concrete implementations are handled in plugins"
requires-python = "==3.13.*"

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest>=9,<10",  # https://github.com/pytest-dev/pytest, MIT
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
