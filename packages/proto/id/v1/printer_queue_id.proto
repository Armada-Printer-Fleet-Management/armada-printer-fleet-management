syntax = "proto3";

// Strongly typed DDD domain ID for the printer_queue domain. A distinct type per entity makes
// passing one entity's ID where another's belongs a type error. See packages/proto/AGENTS.md.
package id.v1;

// Identifies a printer_queue.v1.PrinterQueue.
message PrinterQueueId {
  // UUID.
  string value = 1;
}
