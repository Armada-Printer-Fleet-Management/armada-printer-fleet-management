syntax = "proto3";

// Strongly typed DDD domain ID for the print_preparation domain. A distinct type per entity makes
// passing one entity's ID where another's belongs a type error. See packages/proto/AGENTS.md.
package id.v1;

// Identifies a slice profile: the settings a print may be sliced with.
message SliceProfileId {
  // UUID.
  string value = 1;
}
