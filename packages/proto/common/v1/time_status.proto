syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

// The base timestamps every entity carries, in UTC. A lifecycle need beyond these, such as
// soft delete, uses a superset message that nests this one.
message TimeStatus {
  // When the entity was created.
  google.protobuf.Timestamp created_at = 1;
  // When the entity last changed or, for observed state, was last observed.
  google.protobuf.Timestamp updated_at = 2;
}