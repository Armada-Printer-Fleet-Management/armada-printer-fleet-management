syntax = "proto3";

package common.v1;

// The application's version
// Semantic versioning: major.minor.maintenance, with an optional postfix
// reserved for special releases (e.g. "rc1", "beta"). postfix is typically unused
message VersionInfo {
  // Incremented for incompatible changes.
  uint32 major = 1;
  // Incremented for compatible feature additions.
  uint32 minor = 2;
  // Incremented for fixes.
  uint32 maintenance = 3;
  // Marks a special release, e.g. "rc1". Usually unset.
  optional string postfix = 4;
}