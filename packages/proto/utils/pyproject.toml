[project]
name = "proto-utils"
version = "0.1.0"
description = "Shared helpers for working with buf-generated protobuf code, used by every app that consumes packages/proto."
requires-python = ">=3.13"
dependencies = [
  "protobuf>=7,<8",
]

[dependency-groups]
dev = ["ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_utils"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src"]