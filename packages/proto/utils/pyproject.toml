[project]
name = "proto-utils"
version = "0.1.0"
description = "The Python boundary edge: code generated from packages/proto, plus the mappers between it and core-domain's entities. Used by every Python app."
requires-python = ">=3.13"
dependencies = [
  "protobuf>=7,<8",
  "connectrpc>=0.12.1,<0.13",  # https://github.com/connectrpc/connect-py, Apache-2.0 -- runtime for the generated Connect code
  "core-domain",               # packages/core-domain -- the entities the mappers convert to and from
]

[tool.uv.sources]
core-domain = { path = "../../core-domain", editable = true }

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest>=9,<10",
  "protoc-gen-connectrpc>=0.12.1,<0.13",  # generates the Connect code into src/proto_utils/gen
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_utils"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/proto_utils/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["src/proto_utils/gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]