[project]
name = "backend-server"
# major.minor.maintenance, optionally -postfix (e.g. "0.1.0-rc1") for special releases
version = "0.1.6"
description = "Hosted server for handling requests from the frontend webapp"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "fastapi>=0.141,<1",        # https://github.com/fastapi/fastapi, MIT -- REST routes that don't fit the ConnectRPC model
  "uvicorn[standard]>=0.53,<1", # https://github.com/encode/uvicorn, BSD-3-Clause -- ASGI server for api.main:app
  "protobuf>=7,<8",     # runtime for the buf-generated _pb2 classes; must track protoc's own version line
  "packaging>=24",      # https://github.com/pypa/packaging, the reference PEP 440 parser (also a transitive dep of pip/setuptools/hatchling)
  "proto-utils",        # packages/proto/utils -- generated proto code and the entity mappers
  "organization-info",  # packages/organization-info -- reads the shared organization identity (organization.json)
  "core-domain",        # packages/core-domain -- shared entities, typed IDs and the DDD bases
  "connectrpc>=0.12.1,<0.13", # https://github.com/connectrpc/connect-py, Apache-2.0 -- library for creating RPC contracts that this server implements
  "structlog>=26.1,<27",  # https://github.com/hynek/structlog, MIT OR Apache-2.0 -- structured logging
  "plugin-api",         # packages/plugin-api -- the ports plugins implement, such as FileStore
  "s3-file-store",      # plugins/s3-file-store -- the FileStore plugin for S3-compatible storage
  "pydantic-settings>=2.15.0,<2.16", # https://github.com/pydantic/pydantic-settings, MIT -- reads plugin settings from environment variables
  "alembic>=1.20,<2",       # https://github.com/sqlalchemy/alembic, MIT -- versioned database migrations in migrations/
  "sqlalchemy[asyncio]>=2.1,<2.2", # https://github.com/sqlalchemy/sqlalchemy, MIT -- required by Alembic; Core builds the tables and the dev seed, and is the server's async connection (asyncio adds greenlet)
  "psycopg[binary]>=3.3,<4", # https://github.com/psycopg/psycopg, LGPL-3.0 -- the Postgres driver, sync and async
  "auth-oidc",          # plugins/auth-oidc -- the TokenVerifier plugin for OpenID Connect providers
]

[tool.uv.sources]
# Editable, because proto-utils holds generated code that is gitignored, and a built copy leaves
# gitignored files out.
proto-utils = { path = "../../packages/proto/utils", editable = true }
organization-info = { path = "../../packages/organization-info" }
core-domain = { path = "../../packages/core-domain", editable = true }
plugin-api = { path = "../../packages/plugin-api", editable = true }
s3-file-store = { path = "../../plugins/s3-file-store", editable = true }
auth-oidc = { path = "../../plugins/auth-oidc", editable = true }

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest",
  "httpx2",  # https://github.com/pydantic/httpx2, BSD-3-Clause -- HTTP client Starlette's TestClient requires
  "import-linter>=2.15,<3", # https://github.com/seddonym/import-linter, BSD-2-Clause -- layer contracts below
]

[tool.ruff]
line-length = 100
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["api", "migrations", "dev_seed.py"]
exclude = ["api/gen"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.importlinter]
# The plugin packages are listed so the contracts below can check their imports too.
root_packages = ["api", "plugin_api", "s3_file_store", "auth_oidc"]
include_external_packages = true

# A domain is pure: it sees only core_domain and the standard library. Plugins reach it through
# an infrastructure adapter that implements the domain's own port.
[[tool.importlinter.contracts]]
name = "Domains import no transport, infrastructure, plugin, generated code or framework"
type = "forbidden"
source_modules = ["api.domains"]
forbidden_modules = [
  "api.infrastructure",
  "api.services",
  "api.routers",
  "api.main",
  "api.plugins",
  "proto_utils",
  "google",
  "connectrpc",
  "fastapi",
  "starlette",
  "pydantic",
  "pydantic_settings",
  "plugin_api",
  "s3_file_store",
  "aioboto3",
  "aiobotocore",
  "botocore",
  "sqlalchemy",
  "alembic",
  "psycopg",
  "auth_oidc",
  "jwt",
  "httpx2",
]

# Only api/infrastructure and the composition root (api.main, api.plugins) touch a plugin
[[tool.importlinter.contracts]]
name = "Only infrastructure and the composition root touch plugins"
type = "forbidden"
source_modules = [
  "api.common",
  "api.domains",
  "api.lifespan",
  "api.logging_config",
  "api.middleware",
  "api.routers",
  "api.services",
]
forbidden_modules = ["plugin_api", "s3_file_store", "auth_oidc"]

[[tool.importlinter.contracts]]
name = "Ports depend on no plugin or app"
type = "forbidden"
source_modules = ["plugin_api"]
forbidden_modules = ["api", "s3_file_store", "auth_oidc"]

[[tool.importlinter.contracts]]
name = "Plugins import no app"
type = "forbidden"
source_modules = ["s3_file_store", "auth_oidc"]
forbidden_modules = ["api"]

[[tool.importlinter.contracts]]
name = "Domains are independent of each other"
type = "independence"
modules = ["api.domains.*"]

[[tool.importlinter.contracts]]
name = "Inside a domain, the service sits above its ports"
type = "layers"
containers = ["api.domains.*"]
layers = ["service", "(storage) | repository"]
