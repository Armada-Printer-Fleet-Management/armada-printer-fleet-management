[project]
name = "backend"
# major.minor.maintenance, optionally -postfix (e.g. "0.1.0-rc1") for special releases
version = "0.1.0-alpha"
description = "The desktop application's Python backend: opens the native window and bridges IPC to the frontend."
requires-python = ">=3.13"
dependencies = [
  "pywebview>=6.2,<7",  # https://github.com/r0x0r/pywebview, BSD-3-Clause
  "protobuf>=7,<8",     # runtime for the buf-generated _pb2 classes; must track protoc's own version line
  "packaging>=24",      # https://github.com/pypa/packaging, the reference PEP 440 parser (also a transitive dep of pip/setuptools/hatchling)
  "proto-utils",        # packages/proto/utils -- generated proto code and the entity mappers
  "organization-info",  # packages/organization-info -- reads the shared organization identity (organization.json)
  "core-domain",        # packages/core-domain -- shared entities, typed IDs and the DDD bases
  "connectrpc>=0.12.1,<0.13",  # https://github.com/connectrpc/connect-py, Apache-2.0 -- client to the remote server; pinned as on the server
]

[tool.uv.sources]
# Editable, because proto-utils holds generated code that is gitignored, and a built copy leaves
# gitignored files out.
proto-utils = { path = "../../../packages/proto/utils", editable = true }
organization-info = { path = "../../../packages/organization-info" }
core-domain = { path = "../../../packages/core-domain", editable = true }

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest>=9,<10",  # https://github.com/pytest-dev/pytest, MIT
  "import-linter>=2.15,<3", # https://github.com/seddonym/import-linter, BSD-2-Clause -- layer contracts
]
build = [
  "pyinstaller>=6,<7",
]

[project.scripts]
desktop-backend = "armada_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/armada_app",
  "src/armada_ipc",
  "src/armada_runtime",
  "src/armada_domains",
  "src/armada_infrastructure",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = [
  "armada_app",
  "armada_ipc",
  "armada_runtime",
  "armada_domains",
  "armada_infrastructure",
]
include_external_packages = true

# A domain is pure: it sees only core_domain and the standard library
[[tool.importlinter.contracts]]
name = "Domains import no transport, infrastructure, generated code or framework"
type = "forbidden"
source_modules = ["armada_domains"]
forbidden_modules = [
  "armada_app",
  "armada_ipc",
  "armada_runtime",
  "armada_infrastructure",
  "proto_utils",
  "google",
  "connectrpc",
  "pyqwest",
  "webview",
]

[[tool.importlinter.contracts]]
name = "Domains are independent of each other"
type = "independence"
modules = ["armada_domains.*"]

[[tool.importlinter.contracts]]
name = "Inside a domain, the service sits above its repository port"
type = "layers"
containers = ["armada_domains.*"]
layers = ["service", "repository"]
