[project]
name = "backend"
# major.minor.maintenance, optionally -postfix (e.g. "0.1.0-rc1") for special releases
version = "0.1.0-alpha"
description = "The desktop application's Python backend: opens the native window and bridges IPC to the frontend."
requires-python = ">=3.13"
dependencies = [
  "pywebview>=6.2,<7",  # https://github.com/r0x0r/pywebview, BSD-3-Clause
  "protobuf>=7,<8",     # runtime for the buf-generated _pb2 classes; must track protoc's own version line
  "packaging>=24",      # https://github.com/pypa/packaging, the reference PEP 440 parser (also a transitive dep of pip/setuptools/hatchling)
  "proto-utils",        # packages/proto/utils -- shared protobuf helpers
  "organization-info",  # packages/organization-info -- reads the shared organization identity (organization.json)
]

[tool.uv.sources]
proto-utils = { path = "../../../packages/proto/utils" }
organization-info = { path = "../../../packages/organization-info" }

[dependency-groups]
dev = ["ruff", "pyright"]
build = [
  "pyinstaller>=6,<7",
]

[project.scripts]
desktop-backend = "backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/backend/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src"]
exclude = ["src/backend/gen"]
