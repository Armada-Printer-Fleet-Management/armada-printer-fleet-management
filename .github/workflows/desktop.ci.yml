name: CI (desktop)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-buf
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: uv sync --all-extras --dev
        working-directory: apps/desktop/backend
      - name: Generate API code
        run: python scripts/generate_proto.py buf.gen.desktop_python.yaml
      - run: uv run ruff check .
        working-directory: apps/desktop/backend
      - run: uv run ruff format --check .
        working-directory: apps/desktop/backend
      - run: uv run pyright
        working-directory: apps/desktop/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/frontend
      - uses: ./.github/actions/setup-buf
      - name: Generate API code
        run: python scripts/generate_proto.py buf.gen.desktop_ts.yaml --node-modules apps/desktop/frontend/node_modules
      - run: pnpm exec tsc --noEmit
        working-directory: apps/desktop/frontend
      - run: pnpm exec eslint .
        working-directory: apps/desktop/frontend

  package:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - uses: ./.github/actions/setup-buf
      - name: Install protoc
        shell: powershell
        run: |
          $version = "36.0"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dir = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Join-Path $dir "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/frontend
      - name: Generate API code
        run: |
          python scripts/generate_proto.py buf.gen.desktop_python.yaml
          python scripts/generate_proto.py buf.gen.desktop_ts.yaml --node-modules apps/desktop/frontend/node_modules
      - name: Build the desktop app
        run: python apps/desktop/build_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/backend/dist/
          if-no-files-found: error