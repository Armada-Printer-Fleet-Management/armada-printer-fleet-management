# Lints the deployment scripts, then installs, updates and rolls back a real installation on a
# fresh runner, through both channels: preview (testing, from the release image) and release
# (production, from release files). Images go to a registry inside the job, so no test image ever
# reaches GHCR.
name: CI (test deploy)

on:
  pull_request:
    paths:
      - infra/deploy/**
      - apps/server/deploy.Dockerfile
      - apps/server/migrate.py
      - apps/server/migrations/**
      - apps/web/deploy.Dockerfile
      - scripts/compose_run.py
      - .github/workflows/test-deploy.ci.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck infra/deploy/armada infra/deploy/*.sh

  install-and-update:
    # Pinned: Ubuntu 26.04's sudo ignores -E, which the shell below depends on.
    runs-on: ubuntu-24.04
    defaults:
      run:
        # armada and install.sh run as root, as they do on a real machine. -E keeps the overrides below.
        shell: sudo -E bash --noprofile --norc -euo pipefail {0}
    env:
      ARMADA_REGISTRY: localhost:5000
      ARMADA_IMAGE_OWNER: armada-test
      ARMADA_HEALTH_TIMEOUT: "120"
      IMAGES: localhost:5000/armada-test
      # Build names as deploy.yml makes them on main.
      GOOD_1: sha-000000000001
      GOOD_2: sha-000000000002
      BROKEN: sha-000000000003
      MIGRATE_FAIL: sha-000000000004
      NON_ADDITIVE: sha-000000000005
      ADDITIVE: sha-000000000006
      OLD_ARMADA: sha-000000000007
      SLOW_MIGRATION: sha-000000000008
    steps:
      - uses: actions/checkout@v4

      # The web image ships the bundled sample prints, and its build refuses LFS pointer files.
      - uses: ./.github/actions/lfs-pull
        with:
          include: packages/sample-prints/bundled/**

      # The runner's temporary directory is only known once a step runs, so later steps get the
      # release URL through GITHUB_ENV. Laid out like GitHub's: <base>/download/v<version>/<file>
      # and <base>/latest/download/<file>.
      - name: Start a local registry
        run: |
          echo "ARMADA_RELEASE_URL=file://$RUNNER_TEMP/github/download" >> "$GITHUB_ENV"
          docker run --detach --publish 5000:5000 --name registry registry:2

      - name: Publish preview builds, and production versions 0.0.1 to 0.0.3
        run: |
          github="$RUNNER_TEMP/github"
          # One build of each app, pushed under every name; the names are what armada tells apart.
          for app in server web; do
            docker build --quiet -f "apps/$app/deploy.Dockerfile" -t "armada-$app:built" .
          done
          # The release files come from this checkout's infra/deploy unless another is given.
          publish_preview() {
            local name=$1 deploy=${2:-infra/deploy} files
            for app in server web; do
              docker tag "armada-$app:built" "$IMAGES/armada-$app-preview:$name"
              docker push --quiet "$IMAGES/armada-$app-preview:$name"
            done
            files=$(mktemp -d)
            bash "$deploy/release.sh" preview "$name" test/armada armada-test "$files"
            docker build --quiet -f infra/deploy/release.Dockerfile \
              -t "$IMAGES/armada-release-preview:$name" "$files"
            docker push --quiet "$IMAGES/armada-release-preview:$name"
          }
          publish_preview "$GOOD_1"
          publish_preview "$GOOD_2"

          # Revisions are named by their number, so the newest file names the head.
          head=$(basename "$(ls apps/server/migrations/versions/[0-9]*.py | sort | tail -n 1)" | cut -d _ -f 1)
          echo "MIGRATION_HEAD=$head" >> "$GITHUB_ENV"

          # This build's newest migration raises, so updating to it must return to the previous
          # version.
          docker tag armada-server:built armada-server:good
          docker build --quiet -t armada-server:built - <<EOF
          FROM armada-server:good
          USER root
          RUN printf '%s\n' 'revision = "9999"' 'down_revision = "$head"' 'branch_labels = None' \
                'depends_on = None' 'def upgrade() -> None:' '    raise RuntimeError("deploy test")' \
                'def downgrade() -> None:' '    pass' > migrations/versions/9999_fail.py
          USER armada
          EOF
          publish_preview "$MIGRATE_FAIL"
          docker tag armada-server:good armada-server:built

          # The same images, but its release files count one non-additive migration, so machines
          # that run it must refuse to move back to the builds above.
          printf 'non_additive = True\n' > apps/server/migrations/versions/9998_deploy_test.py
          publish_preview "$NON_ADDITIVE"
          rm apps/server/migrations/versions/9998_deploy_test.py

          # One additive migration past head, so rolling back from it leaves the database at a
          # revision the older build does not know.
          docker build --quiet -t armada-server:built - <<EOF
          FROM armada-server:good
          USER root
          RUN printf '%s\n' 'import sqlalchemy as sa' 'from alembic import op' 'revision = "9997"' \
                'down_revision = "$head"' 'branch_labels = None' 'depends_on = None' \
                'def upgrade() -> None:' '    op.create_table("deploy_test", sa.Column("id", sa.Uuid(), primary_key=True))' \
                'def downgrade() -> None:' '    op.drop_table("deploy_test")' > migrations/versions/9997_additive.py
          USER armada
          EOF
          publish_preview "$ADDITIVE"
          docker tag armada-server:good armada-server:built

          # This build's newest migration takes two minutes, longer than the limit its test allows.
          docker build --quiet -t armada-server:built - <<EOF
          FROM armada-server:good
          USER root
          RUN printf '%s\n' 'import time' 'revision = "9996"' 'down_revision = "$head"' \
                'branch_labels = None' 'depends_on = None' 'def upgrade() -> None:' '    time.sleep(120)' \
                'def downgrade() -> None:' '    pass' > migrations/versions/9996_slow.py
          USER armada
          EOF
          publish_preview "$SLOW_MIGRATION"
          docker tag armada-server:good armada-server:built

          # This build's images, with the release files of the version in production: its armada and
          # compose.yaml predate migrations, so the first update from it is run by an armada that
          # never migrates.
          # As the checkout's owner: git refuses to work in another user's repository as root.
          sudo -u "$SUDO_USER" git fetch --quiet --depth 1 origin tag v0.0.1
          production=$(mktemp -d)
          sudo -u "$SUDO_USER" git archive v0.0.1 infra/deploy | tar -x -C "$production"
          publish_preview "$OLD_ARMADA" "$production/infra/deploy"

          # The broken build's server never reports healthy, so updating to it must return to the
          # previous version.
          docker build --quiet -t armada-server:broken - <<< $'FROM armada-server:built\nHEALTHCHECK --interval=5s CMD ["false"]'
          docker tag armada-server:broken armada-server:built
          publish_preview "$BROKEN"

          for version in 0.0.1 0.0.2 0.0.3; do
            for app in server web; do
              docker tag "$IMAGES/armada-$app-preview:$GOOD_1" "$IMAGES/armada-$app:$version"
              docker push --quiet "$IMAGES/armada-$app:$version"
            done
            bash infra/deploy/release.sh release "$version" test/armada armada-test "$github/download/v$version"
          done
          mkdir -p "$github/latest"
          ln -sfn ../download/v0.0.1 "$github/latest/download"

      - name: Preview channel - install, update, roll back, uninstall and reinstall
        run: |
          expect() {
            local running
            running=$(armada version)
            if [ "$running" != "$1" ]; then
              echo "::error::Expected $1 to be running, found $running"
              armada status || true
              exit 1
            fi
            echo "ok: running $1"
          }
          # The timer would otherwise move the installation while the test is checking it.
          quiet_timer() {
            systemctl stop armada-update.timer
            while systemctl is-active --quiet armada-update.service; do sleep 1; done
          }
          # Pulls first: armada removes the release images it reads, local tags included.
          move() {
            local pointer=$1 name=$2 image
            for image in armada-server armada-web armada-release; do
              docker pull --quiet "$IMAGES/$image-preview:$name" > /dev/null
              docker tag "$IMAGES/$image-preview:$name" "$IMAGES/$image-preview:$pointer"
              docker push --quiet "$IMAGES/$image-preview:$pointer"
            done
          }
          # What a person does on a testing machine: read the installer out of the release image.
          extract() {
            local out container
            out=$(mktemp -d)
            docker pull --quiet "$IMAGES/armada-release-preview:testing" > /dev/null
            container=$(docker create "$IMAGES/armada-release-preview:testing" none)
            docker cp "$container:/release/." "$out"
            docker rm "$container" > /dev/null
            echo "$out"
          }

          echo "::group::Install the build on :testing"
          move testing "$GOOD_1"
          dir=$(extract)
          # Output is captured before grep reads it: grep -q on a pipe can stop the writer mid-output.
          help=$(bash "$dir/install.sh" --help)
          grep -qF -- '--track testing|staging' <<< "$help"
          bash "$dir/install.sh" --non-interactive --domain :80 \
            --admin-email ci@example.invalid --update-policy auto --update-interval 5min
          # A fresh install has its first check scheduled, rather than waiting for a reboot.
          timers=$(systemctl list-timers armada-update.timer --all --no-legend)
          echo "$timers"
          next=$(awk '{ print $1; exit }' <<< "$timers")
          if [ -z "$next" ] || [ "$next" = n/a ] || [ "$next" = - ]; then
            echo "::error::The update timer has no next run after a fresh install"
            exit 1
          fi
          quiet_timer
          expect "$GOOD_1"
          [ "$(armada config track)" = testing ]
          status=$(armada status)
          echo "$status"
          grep -q '^  Track  *testing$' <<< "$status"
          curl -fsS http://localhost/api/health_check
          # The install ran the migrations, so the database is at the newest revision.
          revision=$(docker exec armada-db-1 psql -U armada -d armada -tAc 'SELECT version_num FROM alembic_version')
          if [ "$revision" != "$MIGRATION_HEAD" ]; then
            echo "::error::Expected the database at revision $MIGRATION_HEAD after install, found '$revision'"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Automatic updates wait for the update window"
          timer=/etc/systemd/system/armada-update.timer.d
          [ ! -e "$timer/window.conf" ]
          # A window starting two hours from now, so the check below is always outside it.
          hour=$(( (10#$(date +%H) + 2) % 24 ))
          window=$(printf '%02d:00-%02d:30' "$hour" "$hour")
          armada config update-window "$window"
          grep -qxF "OnCalendar=*-*-* ${window%-*}:00" "$timer/window.conf"
          move testing "$GOOD_2"
          out=$(armada check-for-updates --scheduled)
          echo "$out"
          grep -qF "Not installing it yet" <<< "$out"
          expect "$GOOD_1"
          status=$(armada status)
          grep -qF "$GOOD_2 is available" <<< "$status"
          armada config update-window ""
          [ ! -e "$timer/window.conf" ]
          echo "::endgroup::"

          echo "::group::The update service follows the testing pointer"
          # What the timer starts; for a oneshot service, start waits until the check has finished.
          systemctl start armada-update.service
          journalctl -u armada-update.service --no-pager -n 20
          expect "$GOOD_2"
          echo "::endgroup::"

          echo "::group::Roll back, and automatic updates leave the rolled back version alone"
          armada rollback --yes
          expect "$GOOD_1"
          out=$(armada check-for-updates --scheduled)
          echo "$out"
          grep -qF "rolled back from $GOOD_2" <<< "$out"
          expect "$GOOD_1"
          echo "::endgroup::"

          echo "::group::A build that never becomes healthy is undone"
          if armada update "$BROKEN"; then
            echo "::error::Updating to the broken build reported success"
            exit 1
          fi
          expect "$GOOD_1"
          curl -fsS http://localhost/api/health_check
          echo "::endgroup::"

          echo "::group::A failing migration is reverted to the previous version"
          if out=$(armada update "$MIGRATE_FAIL" 2>&1); then
            echo "$out"
            echo "::error::Updating to a build whose migration fails reported success"
            exit 1
          fi
          echo "$out"
          grep -qF "$MIGRATE_FAIL did not become healthy" <<< "$out"
          # Read from the migrate container's state, so it also shows the container stayed exited
          # rather than being restarted.
          grep -qF "The database migration failed. See why: armada logs migrate" <<< "$out"
          grep -qF "Returning to $GOOD_1" <<< "$out"
          expect "$GOOD_1"
          curl -fsS http://localhost/api/health_check
          echo "::endgroup::"

          echo "::group::A migration that outlasts its time limit is reverted"
          if out=$(ARMADA_MIGRATION_TIMEOUT=30 armada update "$SLOW_MIGRATION" 2>&1); then
            echo "$out"
            echo "::error::Updating past the migration time limit reported success"
            exit 1
          fi
          echo "$out"
          grep -qF "The database migration did not finish in time" <<< "$out"
          grep -qF "Returning to $GOOD_1" <<< "$out"
          expect "$GOOD_1"
          curl -fsS http://localhost/api/health_check
          echo "::endgroup::"

          echo "::group::A stopped migrate, as a reboot leaves it, still counts as healthy"
          docker stop armada-migrate-1 > /dev/null
          status=$(armada status)
          echo "$status"
          grep -qE '^  Health +OK' <<< "$status"
          grep -qE '^ +migrate +stopped$' <<< "$status"
          armada restart
          status=$(armada status)
          grep -qE '^ +migrate +migrated$' <<< "$status"
          curl -fsS http://localhost/api/health_check
          echo "::endgroup::"

          echo "::group::The scheduled check does not follow the pointer back past a non-additive migration"
          armada update "$NON_ADDITIVE"
          expect "$NON_ADDITIVE"
          move testing "$GOOD_1"
          out=$(armada check-for-updates --scheduled)
          echo "$out"
          grep -qF "Not moving to $GOOD_1" <<< "$out"
          expect "$NON_ADDITIVE"
          status=$(armada status)
          echo "$status"
          grep -qF "$GOOD_1 cannot read this database schema" <<< "$status"
          echo "::endgroup::"

          echo "::group::A manual downgrade past it needs --force"
          if armada rollback --yes; then
            echo "::error::Rolling back past a non-additive migration reported success"
            exit 1
          fi
          expect "$NON_ADDITIVE"
          armada rollback --yes --force
          expect "$GOOD_1"
          curl -fsS http://localhost/api/health_check
          # The groups below expect the pointer where the earlier ones left it.
          move testing "$GOOD_2"
          echo "::endgroup::"

          echo "::group::Notify only records the new build"
          armada config update-policy notify
          [ "$(armada config update-policy)" = notify ]
          [ "$(armada config update-policy notify)" = "update-policy is already notify." ]
          armada check-for-updates --scheduled
          expect "$GOOD_1"
          status=$(armada status)
          grep -qF "$GOOD_2 is available" <<< "$status"
          echo "::endgroup::"

          echo "::group::Tracks move within the channel, never across it"
          armada config track staging
          armada config track testing
          if armada config track production; then
            echo "::error::A preview installation moved to production"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Uninstall keeps the data; reinstalling finds it"
          armada uninstall --yes
          [ ! -e /usr/local/bin/armada ]
          [ -f /opt/armada/.env ]
          docker volume inspect armada_pgdata > /dev/null
          bash "$(extract)/install.sh" --non-interactive
          quiet_timer
          expect "$GOOD_2"
          curl -fsS http://localhost/api/health_check
          echo "::endgroup::"

      - name: Release channel - refuse preview tracks, install and follow the latest release
        run: |
          github="$RUNNER_TEMP/github"
          expect() {
            local running
            running=$(armada version)
            if [ "$running" != "$1" ]; then
              echo "::error::Expected $1 to be running, found $running"
              armada status || true
              exit 1
            fi
            echo "ok: running $1"
          }
          quiet_timer() {
            systemctl stop armada-update.timer
            while systemctl is-active --quiet armada-update.service; do sleep 1; done
          }

          echo "::group::The release installer hides and refuses testing"
          help=$(bash "$github/download/v0.0.1/install.sh" --help)
          if grep -qF -- '--track' <<< "$help"; then
            echo "::error::The release installer's help mentions tracks"
            exit 1
          fi
          if bash "$github/download/v0.0.1/install.sh" --non-interactive --track testing; then
            echo "::error::The release installer installed a testing machine"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Reinstall as production; an older release's installer installs its own version"
          armada uninstall --yes
          ln -sfn ../download/v0.0.2 "$github/latest/download"
          out=$(bash "$github/download/v0.0.1/install.sh" --non-interactive --update-policy auto 2>&1)
          echo "$out"
          quiet_timer
          expect 0.0.1
          grep -qF "0.0.2 is available" <<< "$out"
          grep -qF "installs itself at the next scheduled check" <<< "$out"
          [ "$(armada config track)" = production ]
          curl -fsS http://localhost/api/health_check
          # Production has only one track, so nothing shown to its operators names one.
          status=$(armada status)
          echo "$status"
          if grep -q '^  Track' <<< "$status"; then
            echo "::error::A production installation's status shows a track"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::The scheduled check follows the latest release"
          armada check-for-updates --scheduled
          expect 0.0.2
          out=$(armada check-for-updates)
          grep -qxF "Up to date: 0.0.2 is the newest version." <<< "$out"
          echo "::endgroup::"

          echo "::group::Only the running and previous versions' files and images are kept"
          ln -sfn ../download/v0.0.3 "$github/latest/download"
          armada check-for-updates --scheduled
          expect 0.0.3
          [ "$(ls /opt/armada/releases)" = "$(printf '0.0.2\n0.0.3')" ]
          for app in server web; do
            if docker image inspect "$IMAGES/armada-$app:0.0.1" > /dev/null 2>&1; then
              echo "::error::armada-$app:0.0.1 was not removed"
              exit 1
            fi
            docker image inspect "$IMAGES/armada-$app:0.0.2" > /dev/null
          done
          # The database and file storage images are named by every version, so they stay.
          docker image inspect postgres:17-alpine > /dev/null
          echo "::endgroup::"

      - name: Schema - an update run by the production armada migrates, and a rollback keeps the schema
        run: |
          expect() {
            local running
            running=$(armada version)
            if [ "$running" != "$1" ]; then
              echo "::error::Expected $1 to be running, found $running"
              armada status || true
              exit 1
            fi
            echo "ok: running $1"
          }
          revision() {
            docker exec armada-db-1 psql -U armada -d armada -tAc 'SELECT version_num FROM alembic_version'
          }

          echo "::group::Install the production version's armada on an empty database"
          armada uninstall --yes
          # .env keeps the database password, so a new database volume starts with it.
          docker volume rm armada_pgdata > /dev/null
          dir=$(mktemp -d)
          docker pull --quiet "$IMAGES/armada-release-preview:$OLD_ARMADA" > /dev/null
          container=$(docker create "$IMAGES/armada-release-preview:$OLD_ARMADA" none)
          docker cp "$container:/release/." "$dir"
          docker rm "$container" > /dev/null
          # Off, so neither the installer's check nor the timer moves the version during the test.
          bash "$dir/install.sh" --non-interactive --version "$OLD_ARMADA" --update-policy off
          expect "$OLD_ARMADA"
          echo "::endgroup::"

          echo "::group::The update it runs migrates the database"
          armada update "$GOOD_1"
          expect "$GOOD_1"
          if [ "$(revision)" != "$MIGRATION_HEAD" ]; then
            echo "::error::Expected the database at revision $MIGRATION_HEAD after the update, found '$(revision)'"
            exit 1
          fi
          curl -fsS http://localhost/api/health_check
          echo "::endgroup::"

          echo "::group::A rollback past a newer revision keeps the schema and comes back healthy"
          armada update "$ADDITIVE"
          expect "$ADDITIVE"
          [ "$(revision)" = 9997 ]
          armada rollback --yes
          expect "$GOOD_1"
          # Never downgraded: the older version runs against the newer, additive schema.
          if [ "$(revision)" != 9997 ]; then
            echo "::error::Expected the database to stay at revision 9997 after the rollback, found '$(revision)'"
            exit 1
          fi
          curl -fsS http://localhost/api/health_check
          echo "::endgroup::"

      # Uninstalling clears the version, so the next install is a first one with nothing to go back to.
      - name: A first install that never becomes healthy says what to do
        run: |
          armada uninstall --yes
          dir=$(mktemp -d)
          docker pull --quiet "$IMAGES/armada-release-preview:testing" > /dev/null
          container=$(docker create "$IMAGES/armada-release-preview:testing" none)
          docker cp "$container:/release/." "$dir"
          docker rm "$container" > /dev/null
          if out=$(bash "$dir/install.sh" --non-interactive --version "$BROKEN" 2>&1); then
            echo "$out"
            echo "::error::Installing the broken build reported success"
            exit 1
          fi
          echo "$out"
          grep -qF "is the first version on this machine" <<< "$out"
          grep -qF "Armada did not start" <<< "$out"

      - name: Show the stack's logs
        if: failure()
        run: |
          armada status || true
          docker compose --project-name armada logs --no-color || true
