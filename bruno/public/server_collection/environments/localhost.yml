name: localhost
variables:
  - name: baseUrl
    value: localhost:8000
  # The seeded draft job, so the print_job requests run in order without editing. To follow a
  # job you created instead, set this to the ID that Create Print Job returns.
  - name: printJobId
    value: 00000000-0000-4000-8000-000000000001
  # The seeded submitted job's file record. For the byte requests, set this to the slot's fileId
  # that Create Print Job Upload returns.
  - name: fileId
    value: 00000000-0000-4000-8000-000000000201
  # A seeded idle printer, for dispatching a job and then marking the printer ready.
  - name: printerId
    value: 00000000-0000-4000-8000-000000000301
  # The seeded open queue.
  - name: printerQueueId
    value: 00000000-0000-4000-8000-000000000401
