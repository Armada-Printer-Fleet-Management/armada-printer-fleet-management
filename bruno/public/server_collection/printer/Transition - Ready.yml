info:
  name: Transition - Ready
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.PrinterService/TransitionPrinter"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "printerId": { "value": "{{printerId}}" },
        "ready": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
