info:
  name: Get Printer
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.PrinterService/GetPrinter"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "printerId": { "value": "{{printerId}}" } }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
