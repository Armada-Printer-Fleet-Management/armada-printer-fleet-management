info:
  name: Create Print Job Upload
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.PrintJobService/CreatePrintJobUpload"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "printJobId": { "value": "{{printJobId}}" },
        "metadata": {
          "filename": "part.gcode",
          "sizeBytes": "21",
          "sha256": "497c3b63405166a45743bd32d82ac00430d2236baf4d8b8754febf58b9680e13",
          "fileType": "FILE_TYPE_GCODE"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("fileId", res.body.slot.fileId.value);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
