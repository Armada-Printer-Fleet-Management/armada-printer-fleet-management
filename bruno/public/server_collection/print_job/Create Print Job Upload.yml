info:
  name: Create Print Job Upload
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.PrintJobService/CreatePrintJobUpload"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "printJobId": { "value": "{{printJobId}}" },
        "metadata": {
          "filename": "part.gcode",
          "sizeBytes": "1024",
          "sha256": "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee",
          "fileType": "FILE_TYPE_GCODE"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
