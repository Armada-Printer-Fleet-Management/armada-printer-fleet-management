info:
  name: Delete Print Job File
  type: http
  seq: 14

http:
  method: POST
  # Only while the job is a DRAFT; run it before Submit Print Job, or it is refused.
  url: "{{baseUrl}}/api/server.v1.PrintJobService/DeletePrintJobFile"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "printJobId": { "value": "{{printJobId}}" } }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
