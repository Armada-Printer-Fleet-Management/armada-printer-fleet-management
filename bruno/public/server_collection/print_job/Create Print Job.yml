info:
  name: Create Print Job
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.PrintJobService/CreatePrintJob"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userNotes": "Please print in PLA"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
