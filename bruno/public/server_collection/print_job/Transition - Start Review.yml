info:
  name: Transition - Start Review
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.PrintJobService/TransitionPrintJob"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "printJobId": { "value": "{{printJobId}}" },
        "startReview": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
