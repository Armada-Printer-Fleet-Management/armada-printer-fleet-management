info:
  name: Get Print Job
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.PrintJobService/GetPrintJob"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "printJobId": { "value": "{{printJobId}}" }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
