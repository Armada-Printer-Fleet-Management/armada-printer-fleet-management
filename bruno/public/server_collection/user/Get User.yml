info:
  name: Get User
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.UserService/GetUser"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "userId": { "value": "{{userId}}" } }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
