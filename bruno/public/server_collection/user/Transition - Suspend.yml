info:
  name: Transition - Suspend
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.UserService/TransitionUserStatus"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": { "value": "{{userId}}" },
        "suspend": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
