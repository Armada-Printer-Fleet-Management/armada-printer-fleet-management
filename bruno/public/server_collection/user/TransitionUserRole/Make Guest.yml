info:
  name: Make Guest
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.UserService/TransitionUserRole"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": { "value": "{{userId}}" },
        "makeGuest": { "expiresAt": "2030-01-01T00:00:00Z" }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
