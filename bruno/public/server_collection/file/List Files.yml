info:
  name: List Files
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/server.v1.FileService/ListFiles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fileIds": [{ "value": "{{fileId}}" }]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
