info:
  name: Health Check
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/server.v1.HealthCheckService/HealthCheck"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "full": true,
        "check_dependencies": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
